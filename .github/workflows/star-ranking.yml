name: Star Ranking (每月1号)

on:
  schedule:
    # 每月1号 UTC 02:00 = 北京时间 10:00
    - cron: '0 2 1 * *'
  workflow_dispatch:
    # 支持手动触发

permissions:
  contents: write
  pages: write

jobs:
  generate-star-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests jinja2 python-dateutil

      - name: Get current date
        id: date
        run: echo "month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

      - name: Create report directory
        run: mkdir -p reports/${{ steps.date.outputs.month }}

      - name: Run star ranking collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/collect_star.py --output reports/${{ steps.date.outputs.month }}/top50-ai-skills-${{ steps.date.outputs.month }}.html

      - name: Generate trend report
        run: |
          python scripts/build_trend_report.py --output docs/trends.html --top 15

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          git commit -m "data: star ranking ${{ steps.date.outputs.month }}" || echo "No changes to commit"
          git push

      - name: Update GitHub Pages
        if: always()
        run: |
          mkdir -p docs/reports/${{ steps.date.outputs.month }}
          cp reports/${{ steps.date.outputs.month }}/top50-ai-skills-*.html docs/reports/${{ steps.date.outputs.month }}/ || true
          mkdir -p docs/latest
          cp reports/${{ steps.date.outputs.month }}/top50-ai-skills-*.html docs/latest/star-ranking.html || true
          git add docs/
          git commit -m "pages: update star ranking" || echo "No changes"
          git push

      - name: 微信通知构建失败 (Server酱)
        if: failure()
        continue-on-error: true
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            --data-urlencode "title=⚠️ AI-Skills-Rank 构建失败: ${{ github.workflow }}" \
            --data-urlencode "desp=仓库: ${{ github.repository }}
分支: ${{ github.ref_name }}
运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
时间: $(date '+%Y-%m-%d %H:%M:%S')"
